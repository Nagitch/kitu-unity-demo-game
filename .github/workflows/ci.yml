name: Unity demo CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  CARGO_HOME: ${{ github.workspace }}/.kitu/cargo
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  repository:
    name: Demo ${{ matrix.scope }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scope: [reference, fmt, test, clippy, docs, data, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore tracked LFS files
        run: |
          git lfs install --local
          git lfs checkout

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        if: matrix.scope == 'frontend'
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        if: matrix.scope == 'frontend'
        with:
          version: 11.9.0

      - uses: actions/cache@v4
        with:
          path: |
            .kitu/cargo/registry
            .kitu/cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-demo-${{ matrix.scope }}-${{ hashFiles('Cargo.lock') }}

      - name: Prepare Rust and native dependencies
        if: matrix.scope != 'frontend'
        run: python3 tools/setup.py --rust-only

      - name: Prepare Admin and WASM dependencies
        if: matrix.scope == 'frontend'
        run: python3 tools/setup.py

      - name: Verify repository scope
        run: >-
          python3 tools/run.py python3 tools/verify-repository.py
          --scope ${{ matrix.scope }}
          --evidence "$GITHUB_WORKSPACE/.tmp/ci/${{ matrix.scope }}"

      - name: Retain portable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.scope }}
          path: .tmp/ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  macos-native:
    name: Demo macOS native
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Restore tracked LFS files
        run: |
          git lfs install --local
          git lfs checkout

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@master
        with:
          targets: aarch64-apple-darwin
          toolchain: 1.96.0
          components: clippy,rustfmt

      - uses: actions/cache@v4
        with:
          path: |
            .kitu/cargo/registry
            .kitu/cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-demo-native-${{ hashFiles('Cargo.lock') }}

      - name: Prepare Rust and native dependencies
        run: python3 tools/setup.py --rust-only

      - name: Verify native Arena scope
        run: >-
          python3 tools/run.py python3 tools/verify-arena-macos.py
          --scope native
          --evidence "$GITHUB_WORKSPACE/.tmp/ci/macos-native"

      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-native
          path: .tmp/ci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
