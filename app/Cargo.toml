[package]
name = "kitu-demo-game"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/Nagitch/kitu-unity-demo-game"

[lib]
name = "kitu_demo_game"
path = "src/lib.rs"

[[bin]]
name = "kitu-demo-game-admin-host"
path = "src/bin/admin_host.rs"

[dependencies]
kitu-shell = { workspace = true }
anyhow = { workspace = true }
axum = { version = "0.8", features = ["ws"] }
kitu-app-actions = { workspace = true }
kitu-osc-ir = { workspace = true }
kitu-runtime = { workspace = true }
kitu-core = { workspace = true }
kitu-ecs = { workspace = true }
kitu-data-tmd = { workspace = true }
kitu-data-sqlite = { workspace = true }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
kitu-scripting-rhai = { workspace = true }
kitu-tsq1 = { workspace = true }
sha2 = "0.11"
hex = "0.4"
kitu-transport = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
sha2 = "0.11"
hex = "0.4"
serde_json = "1"

[dev-dependencies]
tokio-tungstenite = "0.29"
futures-util = "0.3"
